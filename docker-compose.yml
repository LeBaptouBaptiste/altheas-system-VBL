services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: althea-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT}:3000"
    depends_on:
      - api
    networks:
      - althea-network

  api:
    build:
      context: ./API_Althea-systems
      dockerfile: Dockerfile
    container_name: althea-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017/${POSTGRES_DB}"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - althea-network

  postgres:
    image: postgres:16-alpine
    container_name: althea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - althea-network

  mongodb:
    image: mongo:7
    container_name: althea-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - althea-network

  redis:
    image: redis:7-alpine
    container_name: althea-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - althea-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  althea-network:
    driver: bridge
