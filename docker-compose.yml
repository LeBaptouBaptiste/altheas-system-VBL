services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: althea-front
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: ./API_Althea-systems
      dockerfile: Dockerfile
    container_name: althea-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017/${POSTGRES_DB}"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      Encryption__Key: ${ENCRYPTION_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: althea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: althea-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: althea-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Stripe CLI sidecar — forwards Stripe webhook events from your test-mode
  # account to the API container over the internal Docker network.
  #
  # Activated only with `docker compose --profile dev up` so it never runs
  # in production (where Stripe POSTs directly to the public webhook URL
  # registered in the dashboard).
  #
  # First-run setup:
  #   1. docker compose --profile dev up -d
  #   2. docker logs althea-stripe-cli  → copy the printed whsec_...
  #   3. Put STRIPE_WEBHOOK_SECRET=whsec_... in .env
  #   4. docker compose restart api  (picks up the new secret)
  #   5. Trigger a test event:
  #      docker exec althea-stripe-cli stripe trigger payment_intent.succeeded
  #
  # The secret is regenerated each time `stripe listen` starts. For a stable
  # secret across restarts, register a webhook endpoint in the Stripe
  # dashboard (any URL works for dev) and add `--use-configured-webhooks`
  # to the command below.
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: althea-stripe-cli
    profiles:
      - dev
    # tini-based init so SIGTERM from `docker compose down` reaches the CLI
    # cleanly instead of hanging the shutdown.
    init: true
    command:
      - listen
      - --api-key=${STRIPE_SECRET_KEY}
      - --forward-to=http://api:8080/api/webhooks/stripe
      # --skip-verify : trust the internal Docker network; no TLS between
      # the sidecar and the API (which serves plain HTTP on :8080 inside
      # the network anyway).
      - --skip-verify
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  default:
