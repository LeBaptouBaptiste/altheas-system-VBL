services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: althea-front
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: althea-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    environment:
      OLLAMA_MODEL: tinyllama
      OLLAMA_CONTEXT_LENGTH: 256
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ./API_Althea-systems
      dockerfile: Dockerfile
    container_name: althea-api
    ports:
      - "5207:8080"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017/${POSTGRES_DB}"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: tinyllama
      Ollama__MaxTokens: 512
      Ollama__NumCtx: 256
      Ollama__Temperature: 0.2
      Ollama__SystemPrompt: "You are Althea Systems' assistant. Reply in the same language as the user. Be helpful and concise, and answer general questions when possible. If information is uncertain, state assumptions and ask one clarifying question instead of refusing immediately. Do not invent product-specific facts when you are not sure."
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: althea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: althea-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: althea-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: npm-network
    external: true
