name: CI

on:
  push:
    branches: [main, back-end]
  pull_request:
    branches: [main, back-end]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore dependencies
        run: dotnet restore API_Althea-systems/API_Althea-systems.slnx

      - name: Build
        run: dotnet build API_Althea-systems/API_Althea-systems.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test API_Althea-systems/API_Althea-systems.slnx --no-build --configuration Release --verbosity normal
